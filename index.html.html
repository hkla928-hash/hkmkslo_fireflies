<script>
(() => {
  "use strict";

  const el = id => document.getElementById(id);
  const accounts = new Map();
  const expectedClassCounts = {
    "1A":33,"1B":33,"1C":33,"1D":33,
    "2A":31,"2B":33,"2C":32,"2D":33,
    "3A":32,"3B":32,"3C":33,"3D":33,
    "4A":32,"4B":31,"4C":28,"4D":33,
    "5A":33,"5B":29,"5C":25,"5D":33,
    "6A":29,"6B":29,"6C":27,"6D":33
  };

  let ready = false;
  let clearTimer;
  let expiry = 0;

  function showNotice(text) {
    el("notice").textContent = text;
    el("notice").hidden = !text;
  }

  function clearResult() {
    clearTimeout(clearTimer);
    expiry = 0;
    el("result").hidden = true;
    ["nameValue","classValue","numberValue","accountValue","passwordValue"]
      .forEach(id => { el(id).textContent = ""; });
  }

  function reset() {
    clearResult();
    showNotice("");
    el("studentId").value = "";
  }

  function expireResult() {
    reset();
    showNotice("查詢結果已自動清除。如有需要，請重新輸入學生證號碼。");
  }

  // 啟動時檢查各班人數、重複號碼和資料格式。
  try {
    let className = "";
    let classNo = 0;
    const counts = {};

    for (const rawLine of el("studentData").textContent.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line) continue;

      if (line.startsWith("@")) {
        className = line.slice(1);
        if (!(className in expectedClassCounts) || className in counts) {
          throw new Error("班別資料異常");
        }
        classNo = 0;
        counts[className] = 0;
        continue;
      }

      const match = /^(\d{9})\s+(\d{6})\s+(.+)$/.exec(line);
      if (!className || !match) throw new Error("資料格式異常");

      const id = "s" + match[1];
      if (accounts.has(id)) throw new Error("學生證號碼重複");

      classNo++;
      counts[className]++;
      accounts.set(id, {
        id,
        name: match[3],
        className,
        classNo,
        password: match[2]
      });
    }

    for (const [name, count] of Object.entries(expectedClassCounts)) {
      if (counts[name] !== count) throw new Error("班別人數不符");
    }

    if (accounts.size !== 753) throw new Error("資料數量不符");
    ready = true;
  } catch (error) {
    accounts.clear();
    showNotice("帳戶資料未能完整載入，請聯絡負責老師。");
  }

  el("queryForm").addEventListener("submit", event => {
    event.preventDefault();
    clearResult();
    showNotice("");

    if (!ready) {
      showNotice("帳戶資料未能完整載入，請聯絡負責老師。");
      return;
    }

    let id = el("studentId").value.trim().toLowerCase();

    // 僅作輸入格式整理，不是身份驗證。
    if (/^s\d{9}@apps\.hkmakslo\.edu\.hk$/.test(id)) {
      id = id.split("@")[0];
    }
    if (/^\d{9}$/.test(id)) id = "s" + id;

    if (!id) {
      showNotice("請先輸入學生證號碼。");
      el("studentId").focus();
      return;
    }

    if (!/^s\d{9}$/.test(id)) {
      showNotice("請輸入 s 後接 9 位數字的學生證號碼，或完整學校電郵。");
      el("studentId").focus();
      return;
    }

    el("studentId").value = id;
    const account = accounts.get(id);

    if (!account) {
      showNotice("找不到此學生證號碼。請檢查號碼，或聯絡負責老師。");
      return;
    }

    el("nameValue").textContent = account.name;
    el("classValue").textContent = account.className;
    el("numberValue").textContent = String(account.classNo);
    el("accountValue").textContent = account.id;
    el("passwordValue").textContent = account.password;
    el("result").hidden = false;
    showNotice("已找到帳戶，資料顯示如下。");

    expiry = Date.now() + 60000;
    clearTimer = setTimeout(expireResult, 60000);
  });

  el("studentId").addEventListener("input", () => {
    clearResult();
    if (ready) showNotice("");
  });

  el("clearButton").addEventListener("click", () => {
    reset();
    el("studentId").focus();
  });

  // 背景分頁的計時可能延遲，因此返回畫面時再檢查到期時間。
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && expiry && Date.now() >= expiry) {
      expireResult();
    }
  });

  window.addEventListener("pagehide", reset);
  window.addEventListener("pageshow", event => {
    if (event.persisted) reset();
  });
})();
</script>


</body></html>
